plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yourstube'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation("com.google.api-client:google-api-client:2.9.0")
    implementation("com.google.apis:google-api-services-youtube:v3-rev20260820-2.0.0")
    implementation("com.google.apis:google-api-services-youtubeAnalytics:v2-rev20230704-2.0.0")
    implementation("com.google.apis:google-api-services-youtubereporting:v1-rev20260506-2.0.0")
    implementation("com.google.oauth-client:google-oauth-client-jetty:1.39.0") {
        exclude group: 'org.mortbay.jetty', module: 'servlet-api'
    }
    implementation("com.google.http-client:google-http-client-jackson2:2.2.0")
    implementation("com.google.collections:google-collections:1.0")
}

tasks.named('test') {
	useJUnitPlatform()
}
